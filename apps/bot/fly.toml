# Result Clanker — Discord worker.
# Deploy from the repository root:
#   flyctl deploy --config apps/bot/fly.toml --dockerfile apps/bot/Dockerfile
app = "result-clanker"
primary_region = "ams"

[build]

[env]
  NODE_ENV = "production"

# No [http_service] or [[services]]: the bot accepts no inbound traffic, so it
# needs no public IP. It must never scale to zero — a stopped machine means the
# Discord gateway drops and the operation queue stops draining.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
